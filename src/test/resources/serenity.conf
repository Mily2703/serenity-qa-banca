serenity {
  project.name = "Serenity QA Banca - ParaBank"
  take.screenshots = FOR_FAILURES
  logging = VERBOSE
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 5000
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["headless=new", "window-size=1366,900", "remote-allow-origins=*",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage", "lang=es-PE"]
    }
  }
}

headless.mode = true

environments {
  default {
    parabank.web.url = "https://parabank.parasoft.com/parabank"
    # REST: <services>/bank/...   SOAP: <services>/ParaBank
    parabank.services.url = "https://parabank.parasoft.com/parabank/services"
    parabank.demo.user = "john"
    parabank.demo.password = "demo"
  }
}
